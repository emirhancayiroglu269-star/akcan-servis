# Güncelleme otomasyonu
# - Her gönderimde index.html ve teklif.html sözdizimi kontrol edilir (site GitHub Pages ile kendiliğinden yayınlanır).
# - supabase/functions altında değişen fonksiyonlar Supabase'e otomatik dağıtılır.
#   Bunun için depo ayarlarında SUPABASE_ACCESS_TOKEN adlı bir Actions secret tanımlı olmalıdır.
# - Veritabanı değişiklikleri (supabase/migrations) otomatik uygulanmaz; onaylı olarak elle uygulanır.
name: Güncelleme
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hepsi:
        description: "Tüm fonksiyonları yeniden dağıt"
        type: boolean
        default: false

concurrency: { group: guncelleme, cancel-in-progress: false }

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Sayfa betiklerini kontrol et
        run: |
          node -e '
            const fs=require("fs");
            for (const f of ["index.html","teklif.html"]) {
              const h=fs.readFileSync(f,"utf8"); let i=0;
              for (const m of h.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)) {
                const p=`/tmp/${f}.${i++}.js`; fs.writeFileSync(p,m[1]);
                require("child_process").execFileSync("node",["--check",p],{stdio:"inherit"});
              }
              console.log(f, "tamam");
            }'

  fonksiyonlar:
    needs: kontrol
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJE: amtgrdyongsmkrfdmhgq
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Değişen fonksiyonları bul
        id: bul
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.hepsi }}" = "true" ]; then
            LISTE=$(ls supabase/functions)
          else
            LISTE=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | cut -d/ -f3 | sort -u)
            # Ortak dosya değiştiyse hepsini dağıt
            if echo "$LISTE" | grep -qx "_shared"; then LISTE=$(ls supabase/functions); fi
          fi
          LISTE=$(for f in $LISTE; do [ -f "supabase/functions/$f/index.ts" ] && [ "$f" != "bh-test" ] && echo "$f"; done)
          echo "liste=$(echo $LISTE)" >> "$GITHUB_OUTPUT"
          echo "Dağıtılacak: ${LISTE:-yok}"
      - name: Secret kontrolü
        if: steps.bul.outputs.liste != ''
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN tanımlı değil; fonksiyonlar dağıtılmadı (${{ steps.bul.outputs.liste }})."
            echo "ATLA=1" >> "$GITHUB_ENV"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.bul.outputs.liste != '' && env.ATLA != '1'
        with: { version: latest }
      - name: Dağıt
        if: steps.bul.outputs.liste != '' && env.ATLA != '1'
        run: |
          for f in ${{ steps.bul.outputs.liste }}; do
            echo "== $f"; supabase functions deploy "$f" --project-ref "$PROJE" --use-api
          done

  veritabani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Yeni veritabanı değişikliği uyarısı
        run: |
          Y=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- supabase/migrations || true)
          if [ -n "$Y" ]; then echo "::notice::Yeni veritabanı değişikliği eklendi, otomatik uygulanmaz: $Y"; fi
