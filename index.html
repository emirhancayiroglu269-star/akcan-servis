/* ---------- hesaplar ---------- */
function hesap(kalemler,indirim){
  let ara=0,kdv=0,parca=0,iscilik=0,maliyet=0;
  for(const k of kalemler||[]){
    const adet=num(k.adet), tutar=adet*num(k.fiyat), oran=num(k.kdv);
    ara+=tutar; kdv+=tutar-tutar/(1+oran/100);
    if(k.tip==="parca"){ parca+=tutar; maliyet+=adet*num(k.alis); } else iscilik+=tutar;
  }
  const ind=Math.min(num(indirim),ara), genel=ara-ind, oranK=ara>0?genel/ara:0;
  kdv*=oranK; const matrah=genel-kdv;
  return {ara:r2(ara),indirim:r2(ind),genel:r2(genel),kdv:r2(kdv),matrah:r2(matrah),parca:r2(parca*oranK),iscilik:r2(iscilik*oranK),maliyet:r2(maliyet),kar:r2(matrah-maliyet)};
}
const odenenGonderilmemis=r=>r2((r.tahsilatlar||[]).filter(t=>t.yontem!=="Veresiye"&&!t.bhAktarildi).reduce((s,t)=>s+num(t.tutar),0));
const odenen=r=>r2((r.tahsilatlar||[]).filter(t=>t.yontem!=="Veresiye").reduce((s,t)=>s+num(t.tutar),0));
function isAktifEtki(r,tip){ return tip==="satis"? !r.iptal : KAPALI.includes(r.durum); }
function istenenEtki(r,tip){
  const m={}; if(!isAktifEtki(r,tip)) return m;
  for(const k of r.kalemler||[]){ if(k.tip!=="parca"||!k.stokId) continue; const st=S.stok[k.stokId]; if(st&&st.tur==="hizmet") continue;
    const key=k.stokId+"|"+(r.depo||depolar()[0]||"Depo"); m[key]=r2((m[key]||0)+num(k.adet)); }
  return m;
}
async function stokEtkisiUygula(r,tip,zorlaSifir){
  const yeni=zorlaSifir?{}:istenenEtki(r,tip), eski=r.stokEtkisi||{};
  const keys=new Set([...Object.keys(yeni),...Object.keys(eski)]);
  for(const key of keys){
    const d=r2((yeni[key]||0)-(eski[key]||0)); if(!d) continue;
    const i=key.lastIndexOf("|"), sid=key.slice(0,i), depo=key.slice(i+1), st=S.stok[sid]; if(!st) continue;
    const miktar=Object.assign({},st.miktar||{}); miktar[depo]=r2(num(miktar[depo])-d);
    const har=[{t:Date.now(),depo,degisim:-d,aciklama:(tip==="satis"?"Satış ":"İş emri ")+(r.no||"")}].concat(st.hareketler||[]).slice(0,80);
    await put("stok",sid,Object.assign({},st,{miktar,hareketler:har}));
  }
  r.stokEtkisi=yeni;
}
function musteriBakiye(mid){
  let borc=num((S.musteriler[mid]||{}).devir),alacak=0;
  for(const r of list("isemirleri")) if(r.musteriId===mid && KAPALI.includes(r.durum) && !(r.bhAktarildi&&r.bhFaturali)){ borc+=hesap(r.kalemler,r.indirim).genel; alacak+=odenenGonderilmemis(r); }
  for(const s of list("satislar")) if(s.musteriId===mid && !s.iptal && !(s.bhAktarildi&&s.bhFaturali)){ borc+=hesap(s.kalemler,s.indirim).genel; alacak+=odenenGonderilmemis(s); }
  const m=S.musteriler[mid]; if(m) for(const o of m.odemeler||[]) if(!o.bhAktarildi) alacak+=num(o.tutar);
  return r2(borc-alacak);
}
const toplamStok=st=>r2(Object.values(st.miktar||{}).reduce((s,v)=>s+num(v),0));
const kritikMi=st=>st.tur!=="hizmet" && num(st.kritik)>0 && toplamStok(st)<=num(st.kritik);

function yeniNo(col,onek){
  const d=new Date(), pre=onek+"-"+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+"-";
  let n=1; for(const r of list(col)) if(r.no&&r.no.startsWith(pre)) n=Math.max(n,(parseInt(r.no.slice(pre.length),10)||0)+1);
  return pre+pad(n);
}

/* ---------- kayıt katmanı ---------- */
const LS_KEY="akcan-oto-servis-yerel";
function yerelYukle(){ try{ const o=JSON.parse(localStorage.getItem(LS_KEY)||"{}"); for(const c of COLS) S[c]=o[c]||{}; S.ayarlar=Object.assign({},DEF_AYAR,o.ayarlar||{}); }catch(e){} }
function yerelKaydet(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){} }
function hataMesaj(e){
  const c=e&&e.code; if(e&&e.message&&/JWT|permission|policy/i.test(e.message)) return "Oturum süresi doldu ya da yetkiniz yok. Sayfayı yenileyip tekrar giriş yapın.";
  if(c==="invalid_argument") return "Kaydedilemedi: bu sayfada değişiklik yetkiniz yok ya da kayıt çok büyük.";
  if(c==="quota_exceeded") return "Veritabanı dolu. Eski kayıtları silip tekrar deneyin.";
  if(c==="resource_exhausted") return "Çok hızlı işlem yapıldı. Birkaç saniye bekleyip tekrar deneyin.";
  if(c==="revoked") return "Bu sayfaya erişim kapandı. Sayfayı yeniden açın.";
  return "Kaydedilemedi, bağlantıyı kontrol edip tekrar deneyin.";
}
const BH_ALAN=["bhGuid","bhUrl","bhGonderilenTahsilat","bhFaturali","bhSon","bhId","bhKod","bhHata","bhGonderim","onay","onayGecmis","teklifToken"];
function bhKoru(col,id,obj){
  const cur=col==="ayarlar"?null:S[col][id]; if(!cur) return obj;
  for(const k of BH_ALAN) if(cur[k]!==undefined) obj[k]=cur[k];
  const esle=(yeni,eski)=>(yeni||[]).map(t=>{ const e=(eski||[]).find(x=>x.t===t.t&&num(x.tutar)===num(t.tutar)&&x.yontem===t.yontem); return e&&e.bhAktarildi&&t.bhAktarildi===undefined?Object.assign({},t,{bhAktarildi:true,bhGuid:e.bhGuid}):(e&&e.bhAktarildi?Object.assign({},t,{bhAktarildi:true,bhGuid:e.bhGuid}):t); });
  if(obj.tahsilatlar) obj.tahsilatlar=esle(obj.tahsilatlar,cur.tahsilatlar);
  if(obj.odemeler) obj.odemeler=esle(obj.odemeler,cur.odemeler);
  return obj;
}
async function put(col,id,obj){
  obj=Object.assign({},obj,{id,guncelleme:Date.now()});
  if(col==="ayarlar"){ if(id==="genel") S.ayarlar=obj; else AY[id]=obj; }
  else { obj=bhKoru(col,id,obj); S[col][id]=obj; }
  if(sb){
    for(let i=0;;i++){
      const {error}=await sb.from("docs").upsert({col,id,data:obj});
      if(!error) break;
      if(i<3&&!/permission|policy|JWT/i.test(error.message||"")){ await new Promise(r=>setTimeout(r,700*(i+1))); continue; }
      throw error;
    }
  } else { yerelKaydet(); renderSoon(); }
}
async function del(col,id){
  delete S[col][id];
  if(sb){ const {error}=await sb.from("docs").delete().eq("col",col).eq("id",id); if(error) throw error; } else { yerelKaydet(); renderSoon(); }
}
let _rs=0; function renderSoon(){ cancelAnimationFrame(_rs); _rs=requestAnimationFrame(render); }

async function verileriYukle(){
  mod="yukleniyor"; render();
  try{
    const [{data:rl,error:re},{data:ud}]=await Promise.all([sb.rpc("akcan_rol"),sb.auth.getUser()]);
    if(re) throw re;
    ROL=rl||"yok"; KULLANICI={eposta:(ud&&ud.user&&ud.user.email)||"",ad:"",rol:ROL};
    if(ROL==="yok"){ mod="giris"; $("#gbar").style.display="none"; $("#nav").innerHTML=""; $("#main").innerHTML=`<div class="card" style="max-width:420px;margin:40px auto"><h2>Yetki verilmemiş</h2><p>${esc(KULLANICI.eposta)} hesabına bu programda yetki tanımlanmamış. Yöneticinizden sizi Ayarlar → Kullanıcılar bölümünden eklemesini isteyin.</p><button class="btn" data-act="cikis">Çıkış yap</button></div>`; return; }
    const o={musteriler:{},araclar:{},isemirleri:{},stok:{},satislar:{},giderler:{},kasakapanis:{},bhhareket:{},ayarlar:{}};
    for(let from=0;;from+=1000){
      const {data,error}=await sb.from("docs").select("col,id,data").order("col").order("id").range(from,from+999);
      if(error) throw error;
      for(const r of data) if(o[r.col]) o[r.col][r.id]=r.data;
      if(data.length<1000) break;
    }
    for(const c of COLS) S[c]=o[c];
    S.bhhareket=o.bhhareket;
    AY=o.ayarlar; S.ayarlar=Object.assign({},DEF_AYAR,AY.genel||{}); SENK=AY.senkron||null;
    const ben=((AY.kullanicilar||{}).liste||[]).find(k=>String(k.eposta).toLowerCase()===String(KULLANICI.eposta).toLowerCase()); if(ben) KULLANICI.ad=ben.ad;
    if(!izin(view)){ view="panel"; history.replaceState(null,"","#panel"); }
    mod="bulut"; yuklemeHata=""; $("#gbar").style.display=""; render();
  }catch(e){ yuklemeHata="Veriler yüklenemedi: "+(e.message||e); mod="bulut"; render(); }
  sb.channel("docs-degisim").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    const r=p.new&&p.new.col?p.new:p.old; if(!r) return;
    if(p.eventType==="DELETE"){ if(S[r.col]&&r.col!=="ayarlar") delete S[r.col][r.id]; }
    else if(r.col==="ayarlar"){ AY[r.id]=r.data; if(r.id==="genel") S.ayarlar=Object.assign({},DEF_AYAR,r.data); if(r.id==="senkron") SENK=r.data; if(r.id==="kullanicilar") sb.rpc("akcan_rol").then(({data})=>{ if(data&&data!==ROL){ ROL=data; if(ROL==="yok") location.reload(); if(!izin(view)) location.hash="#panel"; renderSoon(); } }); }
    else if(S[r.col]){
      if(r.col==="isemirleri"&&r.data&&r.data.onay){ const es=S.isemirleri[r.id]; if(!es||!es.onay||es.onay.zaman!==r.data.onay.zaman){ toast(`${plakaFmt(r.data.plaka)}: müşteri teklifi ${r.data.onay.durum==="red"?"ONAYLAMADI":"onayladı"}${r.data.onay.not?" · "+r.data.onay.not:""}`); if(F&&F.id===r.id){ F.onay=r.data.onay; F.onayGecmis=r.data.onayGecmis; } } }
      S[r.col][r.id]=r.data; }
    renderSoon();
  }).subscribe();
}

  return ex.concat(rest).slice(0,lim||8); }

/* raporlar */
function aralik(){
  const now=new Date(), R=UI.rapor; let b,e;
  const y=now.getFullYear(), m=now.getMonth();
  if(R.aralik==="bugun"){ b=gunBasi(now); e=b+86400000; }
  else if(R.aralik==="hafta"){ const d=new Date(gunBasi(now)); const g=(d.getDay()+6)%7; b=d.getTime()-g*86400000; e=b+7*86400000; }
  else if(R.aralik==="ay"){ b=new Date(y,m,1).getTime(); e=new Date(y,m+1,1).getTime(); }
  else if(R.aralik==="gecenay"){ b=new Date(y,m-1,1).getTime(); e=new Date(y,m,1).getTime(); }
  else if(R.aralik==="yil"){ b=new Date(y,0,1).getTime(); e=new Date(y+1,0,1).getTime(); }
  else { b=fromInput(R.bas)||new Date(y,m,1).getTime(); e=(fromInput(R.bit)||gunBasi(now))+86400000; }
  return [b,e];
}
function raporVeri(){
  const [b,e]=aralik();
  const ie=list("isemirleri").filter(r=>KAPALI.includes(r.durum)&&r.kapanis>=b&&r.kapanis<e);
  const sa=list("satislar").filter(s=>!s.iptal&&s.tarih>=b&&s.tarih<e);
  return {b,e,ie,sa};
}
/* ---------- BizimHesap'ta yapılan satış ve tahsilatlar ---------- */
function bhAralik(k){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), bg=gunBasi(now);
  if(k==="bugun") return [bg,bg+86400000];
  if(k==="dun") return [bg-86400000,bg];
  if(k==="hafta"){ const g=(new Date(bg).getDay()+6)%7; return [bg-g*86400000,bg-g*86400000+7*86400000]; }
  if(k==="ay") return [new Date(y,m,1).getTime(),new Date(y,m+1,1).getTime()];
  if(k==="gecenay") return [new Date(y,m-1,1).getTime(),new Date(y,m,1).getTime()];
  return [0,Infinity];
}

const bhTahsilatMi=h=>/^Tahsilat/i.test(h.tip);
function bhHareketler(b,e){ return list("bhhareket").filter(h=>(h.tarih||0)>=b&&(h.tarih||0)<e); }

    <div class="main"><div class="t1">${esc(h.musteriAd||"-")}</div>
      <div class="t2">${tarih(h.tarih)}${h.odeme?" · "+esc(h.odeme):""}${h.programNo?` · <b>Programdan: ${esc(h.programNo)}</b>`:" · BizimHesap'ta girildi"}${h.not&&!/^Satış\s*$/i.test(h.not)?" · "+esc(h.not.slice(0,80)):""}</div></div>
    <div class="end"><b>${TL(h.tutar)}</b></div></div>`;

/* ---------- Gün sonu kasa ---------- */
const YON_BH={"Nakit":"Nakit","Kredi Kartı":"Kredi Kartı","Havale/EFT":"Banka"};
function kasaVeri(gun,depo){
  const b=fromInput(gun)||gunBasi(Date.now()), e=b+86400000, dOk=d=>depo==="Tümü"||(d||"")===depo;
  const tah=[], gid=[];
  for(const r of list("isemirleri")) if(r.durum!=="İptal"&&dOk(r.depo)) for(const t of r.tahsilatlar||[]) if(t.t>=b&&t.t<e&&t.yontem!=="Veresiye") tah.push({t:t.t,a:`${r.no} · ${plakaFmt(r.plaka)} · ${r.musteriAd||""}`,yontem:t.yontem,tutar:num(t.tutar),kasaId:t.kasaId||""});
  for(const x of list("satislar")) if(!x.iptal&&dOk(x.depo)) for(const t of x.tahsilatlar||[]) if(t.t>=b&&t.t<e&&t.yontem!=="Veresiye") tah.push({t:t.t,a:`${x.no} · ${x.musteriAd||"Perakende"}`,yontem:t.yontem,tutar:num(t.tutar),kasaId:t.kasaId||""});
  if(depo==="Tümü") for(const m of list("musteriler")) for(const o of m.odemeler||[]) if(o.t>=b&&o.t<e) tah.push({t:o.t,a:`Cari tahsilat · ${m.ad}`,yontem:o.yontem||"Nakit",tutar:num(o.tutar),kasaId:o.kasaId||""});
  for(const g of list("giderler")) if((g.tarih||0)>=b&&(g.tarih||0)<e&&dOk(g.depo)) gid.push({t:g.tarih,a:`${g.kategori}${g.aciklama?" · "+g.aciklama:""}`,yontem:g.odeme||"Nakit",tutar:num(g.tutar),id:g.id});
  const bh=depo==="Tümü"?bhHareketler(b,e).filter(bhTahsilatMi):[];
  const yon={}; for(const y of ["Nakit","Kredi Kartı","Havale/EFT"]) yon[y]={tah:0,gid:0,bh:0};
  for(const t of tah) (yon[t.yontem]||(yon[t.yontem]={tah:0,gid:0,bh:0})).tah+=t.tutar;
  for(const g of gid) (yon[g.yontem]||(yon[g.yontem]={tah:0,gid:0,bh:0})).gid+=g.tutar;
  for(const h of bh){ const y=Object.keys(YON_BH).find(k=>YON_BH[k]===h.odeme)||h.odeme||"Diğer"; (yon[y]||(yon[y]={tah:0,gid:0,bh:0})).bh+=num(h.tutar); }
  const kasa={}; for(const t of tah){ const k=t.kasaId?kasaAdi(t.kasaId):`${t.yontem} (kasa seçilmemiş)`; kasa[k]=(kasa[k]||0)+t.tutar; }
  tah.sort((x,y)=>x.t-y.t); gid.sort((x,y)=>x.t-y.t);
  return {b,e,tah,gid,bh,yon,kasa};
}
function kasaOnceki(gun,depo){
  return list("kasakapanis").filter(k=>k.depo===depo&&k.gun<gun).sort((x,y)=>y.gun.localeCompare(x.gun))[0]||null;
}

async function kulIslem(govde){
  const {data,error}=await sb.functions.invoke("kullanici-yonet",{body:govde});

V.raporlar=()=>{

  const iscL=Object.values(par).filter(p=>p.tip!=="parca").sort((a,b)=>b.tutar-a.tutar).slice(0,8);

  const gkatL=Object.entries(gkat).sort((x,y)=>y[1]-x[1]), netKar=r2(sv.kar+pr.kar-giderTop);

  // müşteri

  const musL=Object.entries(mus).sort((x,y)=>y[1].c-x[1].c).slice(0,10);

    <div class="tile"><div class="k">Önceki döneme göre</div><div class="v" style="color:${degisim==null?"inherit":degisim>=0?"var(--ok,#1f7a3a)":"var(--bad,#b3261e)"}">${degisim==null?"–":(degisim>=0?"+":"")+degisim.toFixed(1).replace(".",",")+"%"}</div><div class="muted" style="font-size:12px">Önceki: ${TL(onceki)}</div></div>
    <div class="tile"><div class="k">Ortalama fiş</div><div class="v">${TL(ortFis)}</div><div class="muted" style="font-size:12px">${fisSay} fiş</div></div>
    <div class="tile"><div class="k">Kâr marjı</div><div class="v">${ciro>0?marj.toFixed(1).replace(".",",")+"%":"–"}</div><div class="muted" style="font-size:12px">KDV hariç satışa göre</div></div>
  </div>
  <div class="card" style="margin-bottom:16px"><h2>Günlük ciro <span class="legend"><span><i style="background:var(--accent)"></i>Servis</span><span><i style="background:var(--info)"></i>Perakende</span></span></h2>${grafik(gunler)}</div>
  <div class="grid2">
    <div class="card"><h2>Tahsilat dağılımı <span class="sub">${TL(tahT)}</span></h2>${tahL.length?tahL.map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar-bg"><div class="bar" style="width:${(v/Math.max(1,tahT)*100).toFixed(1)}%"></div></div><span class="right">${TL(v)}</span></div>`).join(""):`<div class="empty">Bu aralıkta tahsilat yok.</div>`}<p class="muted" style="font-size:13px;margin:8px 0 0">Veresiye satışlar tahsilat sayılmaz; müşteri carisine borç yazılır.</p></div>
    <div class="card"><h2>Gider dağılımı <span class="sub">${TL(giderTop)}</span></h2>${gkatL.length?gkatL.map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar-bg"><div class="bar" style="width:${(v/Math.max(1,giderTop)*100).toFixed(1)}%"></div></div><span class="right">${TL(v)}</span></div>`).join(""):`<div class="empty">Bu aralıkta gider girilmemiş. <a href="#giderler">Giderler</a> sayfasından ekleyebilirsiniz.</div>`}<p class="muted" style="font-size:13px;margin:8px 0 0">Net kâr = programdaki satışların brüt kârı (KDV hariç, alış fiyatına göre) − girilen giderler. BizimHesap'ta doğrudan kesilen faturalar bu hesaba dahil değildir.</p></div>

      <h2 style="margin-top:16px">Açılan iş emirleri <span class="sub">giriş tarihine göre</span></h2><div class="chips">${Object.entries(durum).map(([d,n])=>`${pill(d)} <b style="margin-right:8px">${n}</b>`).join("")||`<span class="muted">Kayıt yok.</span>`}</div></div>

function grafik(g){
  if(!g.length) return `<div class="empty">Veri yok.</div>`;
  const W=Math.max(320,g.length*22), H=200, P=36, max=Math.max(1,...g.map(x=>x.s+x.p));
  const bw=(W-P-8)/g.length, yS=v=>H-24-(v/max)*(H-40);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Günlük ciro grafiği" style="min-width:${Math.min(W,900)}px">`;
  for(let i=0;i<=2;i++){ const v=max*i/2, y=yS(v); s+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P-4}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v>=1000?Math.round(v/1000)+"b":Math.round(v)}</text>`; }
  g.forEach((x,i)=>{ const X=P+4+i*bw, w=Math.max(2,bw-4), ys=yS(x.s), yp=yS(x.s+x.p);
    if(x.s) s+=`<rect x="${X}" y="${ys}" width="${w}" height="${H-24-ys}" fill="var(--accent)" rx="1"><title>${tarih(x.t)} servis ${TL(x.s)}</title></rect>`;
    if(x.p) s+=`<rect x="${X}" y="${yp}" width="${w}" height="${ys-yp}" fill="var(--info)" rx="1"><title>${tarih(x.t)} perakende ${TL(x.p)}</title></rect>`;
    if(g.length<=31||i%Math.ceil(g.length/31)===0) s+=`<text x="${X+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${new Date(x.t).getDate()}</text>`; });
  return `<div class="tw">${s}</svg></div>`;
}

/* ---------- Genel arama ---------- */
let GSONUC=[], GSEC=0;
function genelAra(q){
  q=String(q||"").trim(); if(q.length<2) return [];
  const ql=low(q), qp=plakaKey(q), qt=telKey(q), qu=up(q), out=[];
  const ar=list("araclar").filter(a=>(qp.length>=2&&plakaKey(a.plaka).includes(qp))||(q.length>=5&&up(a.sasi).includes(qu))).slice(0,5);
  for(const a of ar){ const m=S.musteriler[a.musteriId]||{}; out.push({g:"Araçlar",act:"aracAc",id:a.id,b:plakaFmt(a.plaka),a:[m.ad,a.marka,a.model].filter(Boolean).join(" · ")}); }
  const ie=list("isemirleri").filter(r=>up(r.no).includes(qu)||(qp.length>=2&&plakaKey(r.plaka).includes(qp))||low(r.musteriAd).includes(ql)).sort((a,b)=>(b.giris||0)-(a.giris||0)).slice(0,5);
  for(const r of ie) out.push({g:"İş emirleri",act:"isAc",id:r.id,b:`${r.no} · ${plakaFmt(r.plaka)}`,a:`${r.musteriAd||""} · ${r.durum} · ${tarih(r.giris)}`});
  const mu=list("musteriler").filter(m=>low(m.ad).includes(ql)||(qt.length>=3&&telKey(m.tel).includes(qt))).slice(0,5);
  for(const m of mu) out.push({g:"Müşteriler",act:"musAc",id:m.id,b:m.ad,a:[m.tel,YON()?TL(musteriBakiye(m.id)):""].filter(Boolean).join(" · ")});
  for(const st of stokAra(q,6)) out.push({g:"Ürünler",act:"stokAc",id:st.id,b:`${st.kod||""} ${st.ad}`,a:st.tur==="hizmet"?`İşçilik · ${TL(st.satis)}`:`${depolar().map(d=>d+": "+NF.format(num((st.miktar||{})[d])).replace(/,00$/,"")).join(" · ")} · ${TL(st.satis)}`});
  const sa=list("satislar").filter(x=>up(x.no).includes(qu)).slice(0,3);
  for(const x of sa) out.push({g:"Satışlar",act:"satisAc",id:x.id,b:x.no,a:`${x.musteriAd||"Perakende"} · ${TL(hesap(x.kalemler,x.indirim).genel)}`});
  if(qp.length>=5&&/^\d{2}[A-ZÇĞİÖŞÜ]/.test(qp)&&!ar.length) out.push({g:"Yeni",act:"isYeniPlaka",id:qp,b:`${plakaFmt(qp)} için yeni iş emri aç`,a:"Kayıtlı araç bulunamadı"});
  return out;
}
function genelCiz(){
  const dd=$("#g-dd"); if(!dd) return;
  if(!GSONUC.length){ const v=($("#g-ara")||{}).value||""; dd.innerHTML=v.trim().length>=2?`<div class="dd"><div style="cursor:default">Sonuç yok</div></div>`:""; return; }
  let g="", h="";
  GSONUC.forEach((x,i)=>{ if(x.g!==g){ g=x.g; h+=`<div class="grp">${esc(g)}</div>`; } h+=`<div class="${i===GSEC?"on":""}" data-act="gAc" data-i="${i}"><b>${esc(x.b)}</b> <small>${esc(x.a||"")}</small></div>`; });
  dd.innerHTML=`<div class="dd" style="max-height:70vh">${h}</div>`;
}
function genelKapat(){ GSONUC=[]; GSEC=0; const dd=$("#g-dd"); if(dd) dd.innerHTML=""; }

/* ---------- Kamera ile barkod ---------- */
const KAMERA_VAR=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
let KAMERA=null;
async function kameraAc(cb){
  if(!KAMERA_VAR){ toast("Bu cihazda kamera kullanılamıyor"); return; }
  const prev={M,F};
  $("#modal").insertAdjacentHTML("beforeend",`<div class="ov" id="kamera-ov" style="z-index:40"><div class="sheet narrow" role="dialog" aria-modal="true"><div class="hd"><h2>Barkod okut</h2><button class="btn" data-act="kameraKapat">Kapat</button></div><video id="kamera-v" class="kamera-v" playsinline muted></video><p class="muted" id="kamera-d" style="margin:8px 0 0">Barkodu kameraya gösterin…</p></div></div>`);
  const v=$("#kamera-v"); let akis=null, dur=false;
  KAMERA={kapat:()=>{ dur=true; try{ akis&&akis.getTracks().forEach(t=>t.stop()); }catch(e){} const o=$("#kamera-ov"); if(o) o.remove(); KAMERA=null; }};
  const bitti=kod=>{ if(dur) return; KAMERA&&KAMERA.kapat(); cb(String(kod).trim()); };
  try{
    akis=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
    if(dur){ akis.getTracks().forEach(t=>t.stop()); return; }
    v.srcObject=akis; await v.play();
    if("BarcodeDetector" in window){
      const det=new BarcodeDetector({formats:["ean_13","ean_8","code_128","code_39","upc_a","upc_e","qr_code","itf"]});
      const tara=async()=>{ if(dur) return; try{ const r=await det.detect(v); if(r&&r[0]) return bitti(r[0].rawValue); }catch(e){} requestAnimationFrame(tara); };
      tara();
    } else {
      if(!window.ZXingBrowser) await new Promise((ok,no)=>{ const sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"; sc.onload=ok; sc.onerror=no; document.head.appendChild(sc); });
      const okuyucu=new ZXingBrowser.BrowserMultiFormatReader();
      const tara=async()=>{ if(dur) return; try{ const r=await okuyucu.decodeOnceFromVideoElement(v); if(r) return bitti(r.getText()); }catch(e){} if(!dur) setTimeout(tara,200); };
      tara();
    }
  }catch(e){ const d=$("#kamera-d"); if(d) d.textContent="Kamera açılamadı. Tarayıcıda kamera iznini verin."; }
}

const sayiN=v=>{ const n=typeof v==="number"?v:Number(String(v==null?"":v).replace(",",".")); return isFinite(n)?n:0; };
function teklifOzet(r){
  const s=JSON.stringify([(r.kalemler||[]).map(k=>[k.tip,k.ad,sayiN(k.adet),sayiN(k.fiyat),sayiN(k.kdv)]),sayiN(r.indirim)]);
  let a=5381; for(let i=0;i<s.length;i++) a=((a*33)^s.charCodeAt(i))|0; return (a>>>0).toString(36);
}
function onayDurum(r){ if(!r.onay) return r.teklifToken?"bekliyor":""; if(r.onay.ozet!==teklifOzet(r)) return "degisti"; return r.onay.durum==="red"?"red":"onay"; }
const ONAY_ROZET={bekliyor:["p-Parça","Onay bekliyor"],onay:["p-Tamamlandı","Müşteri onayladı"],red:["p-İptal","Müşteri onaylamadı"],degisti:["p-Parça","Onaydan sonra değişti"]};
const onayRozet=r=>{ const d=onayDurum(r); return d?`<span class="pill ${ONAY_ROZET[d][0]}">${ONAY_ROZET[d][1]}</span>`:""; };
const teklifLink=r=>location.origin+location.pathname.replace(/[^/]*$/,"")+"teklif.html?t="+r.teklifToken;

  return `<div class="sec" id="f-teklif"><h3>Müşteri onayı ${onayRozet(f)}</h3>
    ${f.onay?`<p style="margin:0 0 8px">${f.onay.durum==="red"?"Onaylamadı":"Onayladı"}: <b>${tarihSaat(f.onay.zaman)}</b>${f.onay.ad?" · "+esc(f.onay.ad):""} · ${TL(f.onay.tutar)}${f.onay.not?`<br><span class="muted">Not: ${esc(f.onay.not)}</span>`:""}${d==="degisti"?`<br><span class="late">Onaydan sonra parça/işçilik değişti; yeniden onay alın.</span>`:""}</p>`:""}
    <div class="toolbar" style="margin:0">
      ${f.teklifToken&&!degismis?`${waLink(f.musteriTel,msg,"Teklifi WhatsApp'tan gönder")}<button class="btn sm" data-act="teklifKopyala">Linki kopyala</button><a class="btn sm" href="${esc(teklifLink(f))}" target="_blank" rel="noopener">Müşterinin göreceği sayfa</a>`
        :`<button class="btn sm pri" data-act="teklifOlustur">${f.teklifToken?"Kaydet ve linki güncelle":"Teklif linki oluştur"}</button>`}
    </div>
    <p class="muted" style="font-size:13px;margin:6px 0 0">Müşteri linkte parça ve işçilik kalemlerini, toplamı görür; alış fiyatı ve kâr görünmez. Onay ya da red anında buraya düşer.</p>

function kalemEkleStok(st){

function plakaDoldur(){
  const a=list("araclar").find(x=>plakaKey(x.plaka)===plakaKey(F.plaka));
  if(a){ F.aracId=a.id; F.marka=a.marka||F.marka; F.model=a.model||F.model; F.yil=a.yil||F.yil; F.sasi=a.sasi||F.sasi;
    if(a.sonrakiBakimTarih) F.sonrakiBakimTarih=a.sonrakiBakimTarih; if(a.sonrakiBakimKm) F.sonrakiBakimKm=a.sonrakiBakimKm;
    const m=S.musteriler[a.musteriId]; if(m){F.musteriId=m.id;F.musteriAd=m.ad;F.musteriTel=m.tel||"";}
    const sk=list("isemirleri").filter(r=>r.aracId===a.id).sort((x,y)=>(y.giris||0)-(x.giris||0))[0];
    modalCiz(); toast(sk?`Kayıtlı araç. Son servis: ${tarih(sk.giris)}${sk.km?", "+sk.km+" km":""}`:"Kayıtlı araç bulundu");
  } else F.aracId=null;
}
function musteriDoldur(){
  const m=list("musteriler").find(x=>low(x.ad).trim()===low(F.musteriAd).trim());
  if(m){F.musteriId=m.id; if(!F.musteriTel){F.musteriTel=m.tel||""; const t=$("#f-musteriTel"); if(t) t.value=F.musteriTel;}} else F.musteriId=null;
}
async function musteriCoz(ad,tel,mid){
  ad=String(ad||"").trim(); tel=String(tel||"").trim();
  if(!ad&&!tel) return null;
  let m=mid?S.musteriler[mid]:null;
  if(!m&&telKey(tel).length>=10) m=list("musteriler").find(x=>telKey(x.tel)===telKey(tel));
  if(!m&&ad) m=list("musteriler").find(x=>low(x.ad).trim()===low(ad));
  if(m){ if((ad&&m.ad!==ad)||(tel&&m.tel!==tel)) await put("musteriler",m.id,Object.assign({},m,{ad:ad||m.ad,tel:tel||m.tel})); return S.musteriler[m.id]; }
  const id=uid(); await put("musteriler",id,{ad:ad||"İsimsiz müşteri",tel,eposta:"",adres:"",vergi:"",not:"",odemeler:[],devir:0,bhAktarildi:false,olusturma:Date.now()});
  return S.musteriler[id];
}
async function isKaydetVeri(f,hizli){
    if(!hizli){
    const m=await musteriCoz(f.musteriAd,f.musteriTel,f.musteriId);
    f.musteriId=m?m.id:null; f.musteriAd=m?m.ad:""; f.musteriTel=m?m.tel:"";
    let a=f.aracId?S.araclar[f.aracId]:null; if(!a) a=list("araclar").find(x=>plakaKey(x.plaka)===plakaKey(f.plaka));
    const aid=a?a.id:uid();
    const aYeni=Object.assign({},a||{olusturma:Date.now()},{plaka:plakaKey(f.plaka),musteriId:f.musteriId||(a&&a.musteriId)||null,marka:f.marka||(a&&a.marka)||"",model:f.model||(a&&a.model)||"",yil:f.yil||(a&&a.yil)||"",sasi:f.sasi||(a&&a.sasi)||"",
      km:num(f.km)>num(a&&a.km)?String(f.km):((a&&a.km)||String(f.km||"")),sonrakiBakimTarih:f.sonrakiBakimTarih||(a&&a.sonrakiBakimTarih)||null,sonrakiBakimKm:f.sonrakiBakimKm||(a&&a.sonrakiBakimKm)||""});
    await put("araclar",aid,aYeni); f.aracId=aid; f.plaka=plakaKey(f.plaka);
    }
    if(!f.id){ f.id=uid(); f.no=yeniNo("isemirleri",onek()); f.olusturma=Date.now(); }
    if(KAPALI.includes(f.durum)&&!f.kapanis) f.kapanis=Date.now();
    if(!KAPALI.includes(f.durum)) f.kapanis=null;
    if(f.durum==="Teslim Edildi"&&!f.teslim) f.teslim=Date.now();
    f.indirim=num(f.indirim); f.kalemler=f.kalemler.map(k=>Object.assign({},k,{adet:num(k.adet),fiyat:num(k.fiyat),kdv:num(k.kdv)}));
    await stokEtkisiUygula(f,"is");
    if(f.bhAktarildi){ f.bhAktarildi=false; f.bhDegisti=true; } else if(f.bhAktarildi===undefined) f.bhAktarildi=false;
    const kayit=JSON.parse(JSON.stringify(f)); await put("isemirleri",f.id,kayit);
    return kayit;
}
async function isKaydet(){
  const f=F;
  if(!YON()){ const es=f.id&&S.isemirleri[f.id]; if((f.durum==="İptal")!==((es&&es.durum)==="İptal")){ toast("İptal için yönetici yetkisi gerekir"); return; } } if(!plakaKey(f.plaka)){ toast("Plaka girin"); isSekmeSec("arac"); const el=$("#f-plaka"); if(el) el.focus(); return; }
  const btn=document.querySelector('[data-act="isKaydet"]'); if(btn){btn.disabled=true;btn.textContent="Kaydediliyor…";}
  try{ const kayit=await isKaydetVeri(f,false); toast(`${f.no} kaydedildi`); F=JSON.parse(JSON.stringify(kayit)); modalCiz(); render(); }
  catch(e){ toast(hataMesaj(e)); if(btn){btn.disabled=false;btn.textContent="Kaydet";} }
}
const durumSecenek=cur=>YON()?DURUMLAR:DURUMLAR.filter(d=>d!=="İptal"||d===cur);
async function durumDegistir(id,durum){
  const r=S.isemirleri[id]; if(!r||r.durum===durum) return;
  if((durum==="İptal"||r.durum==="İptal")&&!YON()){ toast("İptal için yönetici yetkisi gerekir"); render(); return; }
  const f=JSON.parse(JSON.stringify(r)); f.dis=f.dis||{}; f.kalemler=f.kalemler||[]; f.tahsilatlar=f.tahsilatlar||[];
  const kalan=r2(hesap(f.kalemler,f.indirim).genel-odenen(f));
  if(durum==="Teslim Edildi"&&kalan>0&&!await onay(`${plakaFmt(f.plaka)} için ${TL(kalan)} tahsil edilmedi. Araç yine de teslim edildi olarak işaretlensin mi? (Kalan tutar müşteri carisine borç yazılır.)`,"Teslim et")){ render(); return; }
  if(durum==="İptal"&&!await onay(`${f.no} iptal edilsin mi? Stoktan düşülen parçalar depoya geri eklenir.`,"İptal et")){ render(); return; }
  f.durum=durum;
  try{ await isKaydetVeri(f,true); toast(`${plakaFmt(f.plaka)}: ${durum}`); render(); }catch(e){ toast(hataMesaj(e)); render(); }
}

document.addEventListener("keydown",e=>{
  const t=e.target, yaziyor=t&&(t.matches&&t.matches("input,textarea,select")||t.isContentEditable);
  if(e.key==="Escape"){ if(KAMERA){ KAMERA.kapat(); return; } if($("#g-dd")&&$("#g-dd").innerHTML){ genelKapat(); if(t.id==="g-ara") t.blur(); return; } if($("#onay-ov")) ACT.onayHayir(); else if(M&&M!=="is") kapat(); return; }
  if(mod==="giris") return;
  const ctrl=e.ctrlKey||e.metaKey;
  if((ctrl&&(e.key==="k"||e.key==="K"))||(e.key==="/"&&!yaziyor)){ e.preventDefault(); if(M&&M!=="is") kapat(); const g=$("#g-ara"); if(g){ g.focus(); g.select(); } return; }
  if(e.key==="F2"){ e.preventDefault(); if(M) kapat(); if(view!=="satis") location.hash="#satis"; setTimeout(()=>{const el=$("#q-satis"); if(el) el.focus();},60); return; }
  if(e.key==="F3"){ e.preventDefault(); if(M&&M!=="is") kapat(); isYeni(null); return; }
  if(e.key==="F4"){ e.preventDefault(); if(M) kapat(); location.hash="#isemirleri"; return; }
  if(ctrl&&(e.key==="s"||e.key==="S")){ if(M==="is"){ e.preventDefault(); isKaydet(); } return; }
  if(e.altKey&&M==="is"&&["1","2","3"].includes(e.key)){ e.preventDefault(); isSekmeSec(["arac","parca","tahsilat"][+e.key-1]); return; }
  if(e.key==="?"&&!yaziyor){ e.preventDefault(); ACT.kisayollar(); return; }
  if(t.id==="g-ara"){
    if(e.key==="ArrowDown"){ e.preventDefault(); if(GSONUC.length){ GSEC=(GSEC+1)%GSONUC.length; genelCiz(); } return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); if(GSONUC.length){ GSEC=(GSEC-1+GSONUC.length)%GSONUC.length; genelCiz(); } return; }
    if(e.key==="Enter"){ e.preventDefault(); if(GSONUC.length) genelAc(GSEC); else { const st=barkodBul(t.value); if(st){ t.value=""; ACT.stokAc({id:st.id}); } } return; }
  }
  if(e.key==="Enter"&&t.matches&&t.matches(".row[data-act]")){ t.click(); return; }
  if(e.key==="Enter"&&t.id==="f-ks"){ e.preventDefault(); const r=stokAra(t.value,1)[0]; if(r) kalemEkleStok(r); else toast("Eşleşen ürün yok"); return; }
  if(e.key==="Enter"&&t.id==="q-satis"){ e.preventDefault(); const r=stokAra(t.value,1)[0]; if(r){ sepetEkle(r); UI.q.satis=""; render(); const el=$("#q-satis"); if(el) el.focus(); } else toast("Eşleşen ürün yok"); }
});
function setPath(o,p,v){ const ks=p.split("."); let x=o; for(let i=0;i<ks.length-1;i++){ x[ks[i]]=x[ks[i]]||{}; x=x[ks[i]]; } x[ks[ks.length-1]]=v; }
document.addEventListener("input",e=>{
  const t=e.target, d=t.dataset;
  if(t.id==="g-ara"){ GSONUC=genelAra(t.value); GSEC=0; genelCiz(); return; }
  if(d.q!==undefined){ UI.q[d.q]=t.value; renderSoon(); return; }
  if(d.f!==undefined&&F){ let v=t.value;
    if(t.type==="datetime-local"||t.type==="date") v=fromInput(v);
    setPath(F,d.f,v);
    if(d.f==="indirim") isToplamYenile();
    if(d.f==="musteriTel"||d.f==="durum"){ const w=$("#f-wa"); if(w) w.innerHTML=waLink(F.musteriTel,sablonDoldur(S.ayarlar.sablon,{musteri:F.musteriAd,plaka:plakaFmt(F.plaka),durum:F.durum,tutar:TL(hesap(F.kalemler,F.indirim).genel),no:F.no}),"WhatsApp ile bildir"); }
    return; }
  if(d.sp!==undefined&&F){ const [i,k]=d.sp.split("."); if(F.siparisler&&F.siparisler[+i]) F.siparisler[+i][k]=t.type==="date"?fromInput(t.value):t.value; return; }
  if(d.k!==undefined&&F){ const [i,k]=d.k.split("."); F.kalemler[+i][k]=t.value; isToplamYenile(); return; }
  if(d.ks!==undefined){ const res=stokAra(t.value,8), dd=$("#f-dd");
    dd.innerHTML=res.length?`<div class="dd">${res.map(s=>`<div data-act="kalemEkle" data-id="${esc(s.id)}"><b>${esc(s.kod||"")}</b> ${esc(s.ad)} <small>${s.tur==="hizmet"?"İşçilik":esc(F.depo)+": "+NF.format(num((s.miktar||{})[F.depo])).replace(/,00$/,"")} · ${TL(s.satis)}</small></div>`).join("")}</div>`:""; return; }
  if(d.m!==undefined&&F){ F[d.m]=t.value; return; }
  if(d.ar!==undefined&&F){ F[d.ar]=t.type==="date"?fromInput(t.value):t.value; return; }
  if(d.st!==undefined&&F){ F[d.st]=t.value; return; }
  if(d.sq!==undefined&&F){ F.miktar=F.miktar||{}; F.miktar[d.sq]=t.value; return; }
  if(d.s!==undefined){ const [i,k]=d.s.split("."); UI.sepet[+i][k]=t.value; const tt=$("#s-tot"); if(tt) tt.innerHTML=totHTML(hesap(UI.sepet,UI.satisIndirim)); return; }
  if(d.u!==undefined){ UI[d.u]=t.value; if(d.u==="satisIndirim"){ const tt=$("#s-tot"); if(tt) tt.innerHTML=totHTML(hesap(UI.sepet,UI.satisIndirim)); } return; }
  if(d.r!==undefined){ UI.rapor[d.r]=t.value; renderSoon(); return; }
});
document.addEventListener("change",e=>{
  const t=e.target, d=t.dataset;
  if(d.durumId){ durumDegistir(d.durumId,t.value); return; }
  if(d.kulrol){ kulIslem({islem:"rol",eposta:d.kulrol,rol:t.value}).then(()=>{toast("Rol güncellendi");render();}).catch(err=>{toast(err.message);render();}); return; }
  if(d.ta!==undefined&&F){ const s=new Set(F.teslimAlinan||[]); t.checked?s.add(d.ta):s.delete(d.ta); F.teslimAlinan=[...s]; return; }
  if(d.f==="plaka"&&F){ F.plaka=plakaFmt(t.value); t.value=F.plaka; plakaDoldur(); return; }
  if(d.f==="musteriAd"&&F){ musteriDoldur(); return; }
  if(d.f==="durum"&&F){ const h=$("#modal .hd h2"); if(h) h.innerHTML=`${F.id?esc(F.no):"Yeni iş emri"} ${pill(F.durum)}`; return; }
  if(d.tahyon!==undefined&&F){ const k=$("#f-tah-kasa-k"); if(k) k.innerHTML=kasaSecHTML("f-tah-kasa",F.depo,t.value); return; }
  if(d.odyon!==undefined){ const k=$("#m-od-kasa-k"); if(k) k.innerHTML=kasaSecHTML("m-od-kasa","",t.value); return; }
  if(d.u==="satisKasa"){ UI.satisKasa=t.value; UI.satisKasaYon=UI.satisYontem+"|"+UI.satisDepo; return; }
  if(d.u==="kasaGun"){ UI.kasaGun=t.value||dInput(Date.now()); UI.kasaSayim=""; UI.kasaAcilis=""; UI.kasaNot=""; render(); return; }
  if(d.u!==undefined){ UI[d.u]=t.value; render(); return; }
  if(t.id==="yedek-dosya"&&t.files&&t.files[0]){ const fr=new FileReader(); fr.onload=async()=>{ t.value="";
      let o; try{ o=JSON.parse(fr.result); }catch(err){ toast("Dosya okunamadı. Programın indirdiği yedek dosyasını seçin."); return; }
      if(!o||!COLS.some(c=>o[c])){ toast("Bu dosya bir yedek dosyasına benzemiyor"); return; }
      const say=COLS.reduce((s,c)=>s+Object.keys(o[c]||{}).length,0);
      if(!await onay(o.kaynak==="BizimHesap"?`BizimHesap aktarımı: ${Object.keys(o.stok||{}).length} ürün, ${Object.keys(o.musteriler||{}).length} müşteri, ${Object.keys(o.araclar||{}).length} araç programa eklenecek. Birkaç dakika sürebilir.`:`${say} kayıt geri yüklenecek. Aynı numaralı kayıtların üzerine yazılır.`,o.kaynak==="BizimHesap"?"Aktar":"Geri yükle")) return;
      const isler=[]; for(const c of ["musteriler","araclar","stok","isemirleri","satislar"]) for(const [id,v] of Object.entries(o[c]||{})) if(!(v.kaynak==="BizimHesap"&&S[c][id]&&S[c][id].kaynak==="BizimHesap")) isler.push([c,id,v]);
      let n=0, hata=null; IMPORT={n:0,say:isler.length}; render();
      const isci=async()=>{ while(isler.length&&!hata){ const [c,id,v]=isler.shift(); try{ await put(c,id,v); n++; IMPORT.n=n; if(n%20===0) renderSoon(); }catch(err){ hata=err; } } };
      await Promise.all([isci(),isci(),isci(),isci(),isci()]);
      try{ if(!hata&&o.ayarlar) await put("ayarlar","genel",Object.assign({},DEF_AYAR,o.ayarlar)); }catch(err){ hata=err; }
      IMPORT=null; render(); toast(hata?`${n} kayıt yüklendi, sonra durdu: ${hataMesaj(hata)} Dosyayı tekrar seçerseniz kaldığı yerden devam eder.`:`${n} kayıt aktarıldı`); };
    fr.readAsText(t.files[0]); }
});
